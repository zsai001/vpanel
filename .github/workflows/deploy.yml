# GitHub Actions workflow for building VPanel
# Version and commit info are automatically extracted from git

name: Build and Deploy

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git describe
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build frontend
        working-directory: ./web
        env:
          # 自动从 git 获取版本信息
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          npm ci
          npm run build
      
      - name: Build backend
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          GIT_COMMIT="${{ github.sha }}"
          
          cd core
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT}" -o ../bin/vpanel-server ./cmd/server
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpanel-build
          path: |
            bin/
            web/dist/

